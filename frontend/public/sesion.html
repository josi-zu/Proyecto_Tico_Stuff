<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Tico Stuff · Iniciar sesión</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/bootstrap-paleta-extendida.css" />
    <link rel="stylesheet" href="css/estilos.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div id="mimenupersonal"></div>
        </header>
        <main class="py-4">
            <h1>Iniciar sesión</h1>
            <p>Ingresa con tu cuenta para acceder a las funciones de tu rol.</p>
            <form id="formSesion" class="col-md-6">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" type="email" class="form-control mb-3" required maxlength="254" autocomplete="username">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control mb-3" required maxlength="128" autocomplete="current-password">
                <button id="ingresar" class="btn btn-primary" type="submit">Ingresar</button>
                <p id="mensajeSesion" role="status" class="mt-3"></p>
            </form>
        </main>

        <footer class="ts-footer">
            © 2026 Tico Stuff · Reventa de ropa y accesorios
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/menu.js" defer></script>
    <script type="module" src="js/sesion.js"></script>
</body>

</html>
