<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Productos | Tico Stuff</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/bootstrap-paleta-extendida.css" />
    <link rel="stylesheet" href="css/estilos.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div id="mimenupersonal"></div>
        </header>

        <main>
            <div class="ts-encabezado">
                <div>
                    <h1>Productos</h1>
                    <p class="ts-subtitulo">Administración del catálogo</p>
                </div>
                <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal"
                    data-bs-target="#modalCrear">
                    + Crear Producto
                </button>
            </div>

            <div class="table-responsive ts-tabla-caja">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Drop</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Condición</th>
                            <th scope="col">Publicación</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="nombreTabla"></tbody>
                </table>
            </div>
        </main>

        <footer class="ts-footer">
            © 2026 Tico Stuff · Reventa de ropa y accesorios
        </footer>
    </div>

    <!-- Modal Crear -->
    <div class="modal fade" id="modalCrear" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProductoCrear">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marca" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" id="categoria_id" required>
                                    <option value="">Selecciona...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Drop</label>
                                <select class="form-select" id="drop_id" required>
                                    <option value="">Selecciona...</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio (₡)</label>
                                <input type="number" class="form-control" id="precio" min="0" step="0.01" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Condición</label>
                                <select class="form-select" id="condicion">
                                    <option value="nuevo">Nuevo</option>
                                    <option value="usado">Usado</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Publicación</label>
                                <select class="form-select" id="estado_publicacion">
                                    <option value="visible">Visible</option>
                                    <option value="oculto">Oculto</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imágenes (una URL por línea)</label>
                            <textarea class="form-control" id="imagenes" rows="3"
                                placeholder="/imagenes/nike-frente.jpg&#10;/imagenes/nike-espalda.jpg"></textarea>
                        </div>
                        <div class="mb-3">
                            <button type="reset" class="btn btn-danger">Reset</button>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProductoEditar">
                        <div class="mb-3">
                            <label class="form-label">Id</label>
                            <input type="text" class="form-control" id="ideditar" readonly />
                        </div>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombreeditar" required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marcaeditar" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcioneditar" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" id="categoria_ideditar" required>
                                    <option value="">Selecciona...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Drop</label>
                                <select class="form-select" id="drop_ideditar" required>
                                    <option value="">Selecciona...</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Precio (₡)</label>
                                <input type="number" class="form-control" id="precioeditar" min="0" step="0.01"
                                    required />
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Condición</label>
                                <select class="form-select" id="condicioneditar">
                                    <option value="nuevo">Nuevo</option>
                                    <option value="usado">Usado</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Publicación</label>
                                <select class="form-select" id="estado_publicacioneditar">
                                    <option value="visible">Visible</option>
                                    <option value="oculto">Oculto</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imágenes (una URL por línea)</label>
                            <textarea class="form-control" id="imageneseditar" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Eliminar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProductoEliminar">
                        <div class="mb-3">
                            <label class="form-label">Id</label>
                            <input type="text" class="form-control" id="ideliminar" disabled />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreeliminar" disabled />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marcaeliminar" disabled />
                        </div>
                        <p class="small text-secondary">
                            Si solo quieres quitarlo del catálogo, es mejor editarlo y ponerlo como
                            <strong>Oculto</strong>.
                        </p>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/menu.js" defer></script>
    <script type="module" src="js/productos.js"></script>
</body>

</html>
