<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Inventario | Tico Stuff</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/bootstrap-paleta-extendida.css" />
    <link rel="stylesheet" href="css/estilos.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div id="mimenupersonal"></div>
        </header>

        <main>
            <div class="ts-encabezado">
                <div>
                    <h1>Inventario</h1>
                    <p class="ts-subtitulo">Existencias por talla y color</p>
                </div>
                <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal"
                    data-bs-target="#modalCrear">
                    + Crear Registro
                </button>
            </div>

            <div class="table-responsive ts-tabla-caja">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">SKU</th>
                            <th scope="col">Producto</th>
                            <th scope="col">Talla</th>
                            <th scope="col">Color</th>
                            <th scope="col">Disponible</th>
                            <th scope="col">Reservada</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="nombreTabla"></tbody>
                </table>
            </div>
        </main>

        <footer class="ts-footer">
            © 2026 Tico Stuff · Reventa de ropa y accesorios
        </footer>
    </div>

    <!-- Modal Crear -->
    <div class="modal fade" id="modalCrear" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Registro de Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formInventarioCrear">
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <select class="form-select" id="producto_id" required>
                                <option value="">Selecciona un producto...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" id="sku" required />
                            <small class="form-text text-body-secondary">Código único de la variante, por ejemplo
                                NIKE-TSH-BLK-M.</small>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Talla</label>
                                <input type="text" class="form-control" id="talla" required />
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" id="color" required />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad disponible</label>
                                <input type="number" class="form-control" id="cantidad_disponible" min="0" value="0"
                                    required />
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad reservada</label>
                                <input type="number" class="form-control" id="cantidad_reservada" min="0" value="0"
                                    required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <button type="reset" class="btn btn-danger">Reset</button>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Registro de Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formInventarioEditar">
                        <div class="mb-3">
                            <label class="form-label">Id</label>
                            <input type="text" class="form-control" id="ideditar" readonly />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <select class="form-select" id="producto_ideditar" required>
                                <option value="">Selecciona un producto...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" id="skueditar" required />
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Talla</label>
                                <input type="text" class="form-control" id="tallaeditar" required />
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" id="coloreditar" required />
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad disponible</label>
                                <input type="number" class="form-control" id="cantidad_disponibleeditar" min="0"
                                    required />
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad reservada</label>
                                <input type="number" class="form-control" id="cantidad_reservadaeditar" min="0"
                                    required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Eliminar Registro de Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formInventarioEliminar">
                        <div class="mb-3">
                            <label class="form-label">Id</label>
                            <input type="text" class="form-control" id="ideliminar" disabled />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <input type="text" class="form-control" id="productoeliminar" disabled />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" id="skueliminar" disabled />
                        </div>
                        <div class="mb-3">
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/menu.js" defer></script>
    <script type="module" src="js/inventario.js"></script>
</body>

</html>
