<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Búsqueda | Tico Stuff</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/bootstrap-paleta-extendida.css" />
    <link rel="stylesheet" href="css/estilos.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div id="mimenupersonal"></div>
        </header>

        <main>
            <div class="ts-encabezado">
                <div>
                    <h1>Búsqueda</h1>
                    <p class="ts-subtitulo" id="contadorResultados">Cargando...</p>
                </div>
            </div>

            <!-- Filtros -->
            <form id="formFiltros" class="filtros-caja">
                <div class="row g-3">
                    <div class="col-12 col-lg-4">
                        <label class="form-label" for="q">Buscar</label>
                        <input type="search" class="form-control" id="q" placeholder="Nombre, descripción o marca..." />
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="filtroMarca">Marca</label>
                        <select class="form-select" id="filtroMarca">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="filtroCategoria">Categoría</label>
                        <select class="form-select" id="filtroCategoria">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="filtroDrop">Drop</label>
                        <select class="form-select" id="filtroDrop">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="filtroCondicion">Condición</label>
                        <select class="form-select" id="filtroCondicion">
                            <option value="">Todas</option>
                            <option value="nuevo">Nuevo</option>
                            <option value="usado">Usado</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <button type="button" class="btn btn-outline-light" id="btnLimpiar">Limpiar filtros</button>
                </div>
            </form>

            <!-- Resultados -->
            <div class="row g-4" id="resultados"></div>
        </main>

        <footer class="ts-footer">
            © 2026 Tico Stuff · Reventa de ropa y accesorios
        </footer>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalleTitulo">Detalle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detalleCuerpo"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/menu.js" defer></script>
    <script type="module" src="js/busqueda.js"></script>
</body>

</html>
